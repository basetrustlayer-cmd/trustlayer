services:
  postgres:
    image: postgres:16-alpine
    container_name: trustlayer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustlayer
      POSTGRES_PASSWORD: trustlayer
      POSTGRES_DB: trustlayer_dev
    ports:
      - "5432:5432"
    volumes:
      - trustlayer_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trustlayer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: trustlayer-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - trustlayer_redpanda_data:/var/lib/redpanda/data

  neo4j:
    image: neo4j:5-community
    container_name: trustlayer-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: none
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - trustlayer_neo4j_data:/data

volumes:
  trustlayer_postgres_data:
  trustlayer_redpanda_data:
  trustlayer_neo4j_data:
